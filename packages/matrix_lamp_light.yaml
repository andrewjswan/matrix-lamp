substitutions:
  num_leds: "256"
  type_leds: "GRB"
  pin_leds: "GPIO3"
  color_correct_bright: "100%"

light:
  # Neopixel with Matrix Lamp
  - platform: neopixelbus
    id: neopixel_led
    icon: mdi:lava-lamp
    type: ${type_leds}
    pin: ${pin_leds}
    num_leds: ${num_leds}
    name: NeoPixel
    color_correct: [$color_correct_bright, $color_correct_bright, $color_correct_bright]
    variant: 800KBPS  # WS2812 (same as 800KBPS)
